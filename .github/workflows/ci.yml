name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    # 每天 08:00（北京时间）触发；GitHub Actions 用 UTC，故写 0:00 (=北京时间 08:00)
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: pytest