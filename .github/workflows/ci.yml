# ============================================================
# CI：接口自动化测试流水线
#
# 触发与执行广度：
#   pull_request        → 冒烟集（6 条）
#   push / 定时         → 全量（40 条）
#   手动（运行工作流程）→ 下拉框自选：
#        执行范围 scope: full（全量 40 条）/ smoke（冒烟 6 条）
#        Python 版本 python: 3.11（默认）/ 3.13
#   冒烟/全量会写进报告「环境」面板的 scope 字段，看报告即可区分。
#
# 稳定性设计：
#   1. 被测服务锁定 commit（SERVICE_COMMIT），避免上游 main 变动导致流水线随机变红
#   2. 依赖走 requirements.lock 精确版本，上游发版不影响构建
#   3. 用例失败必须让流水线变红（不加 continue-on-error）；报告归档用 if: always()
#   4. 线上报告只发布"全量"结果：手动跑冒烟不覆盖 gh-pages，避免链接里只剩 6 条
# ============================================================

name: CI

on:
  # 保持"任何分支 push 都跑"的行为，PR 也会跑
  push:
  pull_request:
  # 手动触发：页面上点「运行工作流程」，选执行范围与 Python 版本
  workflow_dispatch:
    inputs:
      scope:
        description: '执行范围：full=全量 40 条，smoke=冒烟集 6 条'
        type: choice
        options:
          - full
          - smoke
        default: full
      python:
        description: 'Python 版本'
        type: choice
        options:
          - '3.11'
          - '3.13'
        default: '3.11'
  schedule:
    # 每天 08:00（北京时间）触发；GitHub Actions 用 UTC，故写 0:00
    - cron: '0 0 * * *'

# 同一分支的新提交取消上一次未跑完的流水线，避免排队占资源、报告互相覆盖
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 发布 gh-pages 需要写权限；新版仓库默认 token 只读，不声明会直接 403
permissions:
  contents: write

env:
  SERVICE_DIR: service
  SERVICE_REPO: https://github.com/mwinteringham/restful-booker.git
  # 被测服务锁定版本：0046115 是 2026-10 的 main 提交，升级前请先在本地跑一遍全量
  SERVICE_COMMIT: 00461155995c8636866bf51dc444f63033da44fb
  ALLURE_RESULTS: reports/allure-results
  BASE_URL: http://localhost:3001
  # 默认 3.11；手动触发且选择了版本时以手动为准
  PY_VERSION: ${{ inputs.python || '3.11' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ env.PY_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装测试依赖（锁定版本）
        run: |
          pip install -r requirements.lock
          pip check

      - name: 安装 Allure 命令行工具
        run: npm install -g allure-commandline@2.30.0

      - name: 下载并启动 restful-booker 服务（锁定 commit）
        run: |
          set -euo pipefail
          git clone "$SERVICE_REPO" "$SERVICE_DIR"
          git -C "$SERVICE_DIR" checkout --detach "$SERVICE_COMMIT"
          echo "被测服务 commit：$(git -C "$SERVICE_DIR" rev-parse --short HEAD)"
          cd "$SERVICE_DIR"
          npm install
          # 固定 uuid 9.x：新版 uuid 是 ESM，CommonJS 风格的 restful-booker 直接 require 会崩
          npm install uuid@9.0.1
          nohup npm start > ../service.log 2>&1 &

          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL" > /dev/null 2>&1; then
              echo "服务启动成功（第 ${i} 秒响应正常）"
              exit 0
            fi
            echo "等待服务启动... $i/60"
            sleep 1
          done
          echo "::error::restful-booker 60 秒内未启动，以下是服务日志"
          cat ../service.log || true
          exit 1

      - name: 运行测试（PR：冒烟集）
        if: github.event_name == 'pull_request'
        run: pytest -m smoke -q

      - name: 运行测试（手动：按选择的范围）
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "手动触发：scope=${{ inputs.scope }}，python=${{ env.PY_VERSION }}"
          if [ "${{ inputs.scope }}" = "smoke" ]; then
            pytest -m smoke -q
          else
            pytest -q
          fi

      - name: 运行测试（push / 定时：全量）
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        run: pytest -q

      - name: 生成 Allure 报告
        if: always()
        run: |
          if [ -n "$(ls -A "$ALLURE_RESULTS" 2>/dev/null || true)" ]; then
            allure generate "$ALLURE_RESULTS" -o allure-report --clean
          else
            echo "::warning::没有采集到 Allure 结果文件，跳过报告生成"
          fi

      - name: 设置报告默认语言为中文
        if: always()
        run: |
          if [ -f allure-report/index.html ]; then
            python -m common.reporting allure-report
          else
            echo "::warning::报告未生成，跳过默认语言设置"
          fi

      - name: 上传测试报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ env.PY_VERSION }}-${{ github.run_attempt }}
          path: |
            reports/allure-results
            allure-report
            logs
            service.log
          if-no-files-found: warn

      - name: 发布 Allure 报告到 GitHub Pages
        # 只发布 main 上的全量结果：PR、手动冒烟都不覆盖线上报告
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          commit_message: 'ci: 更新 Allure 报告 (${{ github.sha }})'
