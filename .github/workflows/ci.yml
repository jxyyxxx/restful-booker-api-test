name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    # 每天 08:00（北京时间）触发；GitHub Actions 用 UTC，故写 0:00 (=北京时间 08:00)
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载并启动 restful-booker 服务
        run: |
          git clone https://github.com/mwinteringham/restful-booker.git
          cd restful-booker
          npm install
          npm start &
          for i in {1..30}; do
            if curl -s http://localhost:3001 > /dev/null; then
              echo "服务启动成功"
              break
            fi
            echo "等待服务启动... $i/30"
            sleep 1
          done

      - name: 运行测试
        run: pytest