# ============================================================
# 查询预订接口测试数据（共 7 条，全部是反向场景）
# 对应测试用例：testcases/booking/test_query.py
# 字段说明：
#   case_name: 用例名称（会自动作为测试报告里的用例名）
#   booking_id: 预订ID
#   expected_code: 预期HTTP状态码
# 设计说明：
#   正向场景（查询存在的 ID）已改为"自己创建 → 查自己 → 清理"的用例，
#   这里只保留"查询不存在的 ID"这一类反向数据：0、负数、超大值、正常区间内不存在。
# ============================================================

- case_name: "反向-查询不存在的ID=999999"
  booking_id: 999999
  expected_code: 404

- case_name: "反向-查询ID=0"
  booking_id: 0
  expected_code: 404

- case_name: "反向-查询ID为负数=-1"
  booking_id: -1
  expected_code: 404

- case_name: "反向-查询ID为负数=-100"
  booking_id: -100
  expected_code: 404

- case_name: "反向-查询超大ID=999999999"
  booking_id: 999999999
  expected_code: 404

- case_name: "反向-查询不存在的ID=123456"
  booking_id: 123456
  expected_code: 404

- case_name: "反向-查询不存在的ID=888888"
  booking_id: 888888
  expected_code: 404
