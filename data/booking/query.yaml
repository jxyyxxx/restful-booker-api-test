# ============================================================
# 查询预订详情的数据（共 4 条，全部是"查不到"的场景）
# 对应测试用例：testcases/booking/test_query.py::TestBookingDetail
# 字段说明：
#   case_name: 用例名称（会自动作为测试报告里的用例名）
#   booking_id: 预订ID（会直接拼进 URL，所以可以是字符串）
#   expected_code: 预期HTTP状态码
# 设计说明：
#   服务端用 parseInt(id) 取值，所以：
#     - 0 / 负数 / 超大值 → 库里没有对应记录 → 404
#     - "abc" → parseInt 得 NaN → 匹配不到 → 404
#   带小数（12.9）和前导零（0012）会**命中**真实记录，属于另一类"解析缺陷"，
#   因为要用动态创建的 ID 才能断言，写在用例代码里，不放在这份数据里。
# ============================================================

- case_name: "反向-查询ID=0"
  booking_id: 0
  expected_code: 404

- case_name: "反向-查询ID为负数"
  booking_id: -1
  expected_code: 404

- case_name: "反向-查询不存在的ID=999999"
  booking_id: 999999
  expected_code: 404

- case_name: "反向-查询非数字ID"
  booking_id: "abc"
  expected_code: 404
