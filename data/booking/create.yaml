# ============================================================
# 创建预订接口测试数据（共 9 条：正向 5 + 反向 4）
# 对应测试用例：testcases/booking/test_create.py::TestBookingCreate
# 字段说明：
#   case_name: 用例名称（会自动作为测试报告里的用例名）
#   expected_code: 预期HTTP状态码
#   data: 请求体数据
# 设计说明：
#   校验规则是 validate.js 的 {presence: true}，只拦 null/undefined，
#   不拦空字符串、0、false —— 所以 firstname="" 和 totalprice=0 都能创建成功（200），
#   而"少传字段"才会 500（注意：POST 校验失败返回 500，PUT 同样情况返回 400）。
#   这里只放"用数据就能表达"的场景；需要断言回显值、内容协商、类型异常的用例
#   写在用例代码里（见 test_create.py 的另外三个类）。
# 注意：
#   创建成功的用例会在 finally 里删除自己造的数据，否则每跑一轮都会污染列表接口。
# ============================================================

- case_name: "正向-完整数据创建预订"
  expected_code: 200
  data:
    firstname: "张三"
    lastname: "测试"
    totalprice: 200
    depositpaid: true
    bookingdates:
      checkin: "2024-01-01"
      checkout: "2024-01-05"
    additionalneeds: "早餐"

- case_name: "正向-缺少可选字段additionalneeds"
  expected_code: 200
  data:
    firstname: "Alice"
    lastname: "Smith"
    totalprice: 500
    depositpaid: false
    bookingdates:
      checkin: "2024-06-01"
      checkout: "2024-06-10"

- case_name: "正向-价格为0创建预订"
  expected_code: 200
  data:
    firstname: "免费用户"
    lastname: "测试"
    totalprice: 0
    depositpaid: false
    bookingdates:
      checkin: "2024-05-01"
      checkout: "2024-05-02"

- case_name: "正向-价格为超大数创建预订"
  expected_code: 200
  data:
    firstname: "土豪用户"
    lastname: "测试"
    totalprice: 999999
    depositpaid: true
    bookingdates:
      checkin: "2024-07-01"
      checkout: "2024-07-31"
    additionalneeds: "总统套房"

- case_name: "正向-firstname为空字符串创建预订"
  expected_code: 200
  data:
    firstname: ""
    lastname: "只有姓"
    totalprice: 150
    depositpaid: true
    bookingdates:
      checkin: "2024-08-01"
      checkout: "2024-08-03"

- case_name: "反向-缺少必填字段lastname"
  expected_code: 500
  data:
    firstname: "测试无lastname"
    totalprice: 100
    depositpaid: true
    bookingdates:
      checkin: "2024-01-01"
      checkout: "2024-01-02"

- case_name: "反向-缺少必填字段totalprice"
  expected_code: 500
  data:
    firstname: "测试无price"
    lastname: "测试"
    depositpaid: true
    bookingdates:
      checkin: "2024-02-01"
      checkout: "2024-02-02"

- case_name: "反向-缺少必填字段depositpaid"
  expected_code: 500
  data:
    firstname: "测试无deposit"
    lastname: "测试"
    totalprice: 200
    bookingdates:
      checkin: "2024-03-01"
      checkout: "2024-03-02"

- case_name: "反向-缺少必填字段bookingdates"
  expected_code: 500
  data:
    firstname: "测试无dates"
    lastname: "测试"
    totalprice: 200
    depositpaid: true
