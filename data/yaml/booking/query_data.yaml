# ============================================================
# 查询预订接口测试数据
# 对应测试用例：testcases/booking/test_booking_query.py
# 字段说明：
#   case_name: 用例名称（会自动作为测试报告里的用例名）
#   booking_id: 预订ID
#   expected_code: 预期HTTP状态码
# ============================================================

- case_name: "正向-查询存在的ID=1"
  booking_id: 1
  expected_code: 200

- case_name: "正向-查询存在的ID=1-重复1"
  booking_id: 1
  expected_code: 200

- case_name: "正向-查询存在的ID=1-重复2"
  booking_id: 1
  expected_code: 200

- case_name: "反向-查询不存在的ID=999999"
  booking_id: 999999
  expected_code: 404

- case_name: "反向-查询ID=0"
  booking_id: 0
  expected_code: 404

- case_name: "反向-查询ID为负数=-1"
  booking_id: -1
  expected_code: 404

- case_name: "反向-查询ID为负数=-100"
  booking_id: -100
  expected_code: 404

- case_name: "反向-查询超大ID=999999999"
  booking_id: 999999999
  expected_code: 404

- case_name: "反向-查询不存在的ID=123456"
  booking_id: 123456
  expected_code: 404

- case_name: "反向-查询不存在的ID=888888"
  booking_id: 888888
  expected_code: 404
