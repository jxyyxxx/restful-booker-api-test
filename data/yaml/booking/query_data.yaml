# ============================================================
# 查询预订接口测试数据（共 8 条）
# 对应测试用例：testcases/booking/test_booking_query.py
# 字段说明：
#   case_name: 用例名称（会自动作为测试报告里的用例名）
#   booking_id: 预订ID
#   expected_code: 预期HTTP状态码
# 设计说明：
#   正向取种子数据里一定存在的 ID=1；反向覆盖 0、负数、超大值、以及一个不存在的正常区间 ID，
#   分别代表「边界值」与「不存在资源」两类场景。每条数据对应一个独立场景，不用重复数据凑条数。
# ============================================================

- case_name: "正向-查询存在的ID=1"
  booking_id: 1
  expected_code: 200

- case_name: "反向-查询不存在的ID=999999"
  booking_id: 999999
  expected_code: 404

- case_name: "反向-查询ID=0"
  booking_id: 0
  expected_code: 404

- case_name: "反向-查询ID为负数=-1"
  booking_id: -1
  expected_code: 404

- case_name: "反向-查询ID为负数=-100"
  booking_id: -100
  expected_code: 404

- case_name: "反向-查询超大ID=999999999"
  booking_id: 999999999
  expected_code: 404

- case_name: "反向-查询不存在的ID=123456"
  booking_id: 123456
  expected_code: 404

- case_name: "反向-查询不存在的ID=888888"
  booking_id: 888888
  expected_code: 404
