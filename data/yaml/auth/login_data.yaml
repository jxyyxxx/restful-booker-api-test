# ============================================================
# 登录接口测试数据
# 对应测试用例：testcases/test_auth.py
# 字段说明：
#   case_name: 用例名称（会自动作为测试报告里的用例名）
#   username: 用户名
#   password: 密码
#   expected_code: 预期HTTP状态码
#   expected_success: 预期是否登录成功（true/false）
# ============================================================

- case_name: "正向-登录成功"
  username: "admin"
  password: "password123"
  expected_code: 200
  expected_success: true

- case_name: "正向-登录成功-重复验证1"
  username: "admin"
  password: "password123"
  expected_code: 200
  expected_success: true

- case_name: "正向-登录成功-重复验证2"
  username: "admin"
  password: "password123"
  expected_code: 200
  expected_success: true

- case_name: "反向-密码错误"
  username: "admin"
  password: "wrongpwd"
  expected_code: 200
  expected_success: false

- case_name: "反向-密码错误-简单密码"
  username: "admin"
  password: "123456"
  expected_code: 200
  expected_success: false

- case_name: "反向-密码错误-空字符串密码"
  username: "admin"
  password: "   "
  expected_code: 200
  expected_success: false

- case_name: "反向-用户名为空"
  username: ""
  password: "password123"
  expected_code: 200
  expected_success: false

- case_name: "反向-用户名为空格"
  username: "   "
  password: "password123"
  expected_code: 200
  expected_success: false

- case_name: "反向-密码为空"
  username: "admin"
  password: ""
  expected_code: 200
  expected_success: false

- case_name: "反向-用户名不存在"
  username: "notexist"
  password: "password123"
  expected_code: 200
  expected_success: false

- case_name: "反向-用户名不存在-testuser"
  username: "testuser"
  password: "password123"
  expected_code: 200
  expected_success: false

- case_name: "反向-用户名不存在-guest"
  username: "guest"
  password: "password123"
  expected_code: 200
  expected_success: false

- case_name: "反向-用户名和密码都错误"
  username: "wronguser"
  password: "wrongpwd"
  expected_code: 200
  expected_success: false

- case_name: "反向-用户名带特殊字符"
  username: "admin@#$%"
  password: "password123"
  expected_code: 200
  expected_success: false

- case_name: "反向-超长用户名"
  username: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  password: "password123"
  expected_code: 200
  expected_success: false

- case_name: "反向-超长密码"
  username: "admin"
  password: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
  expected_code: 200
  expected_success: false
